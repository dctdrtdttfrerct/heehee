<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kuku Informacje Rodzinne</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        #loginBtn {
            background: #3b82f6;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #loginBtn:hover {
            background: #2563eb;
        }

        #loginBox {
            display: none;
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            width: 300px;
        }

        #panel {
            display: none;
            padding: 20px;
        }

        .item {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        img {
            max-width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>Kuku Informacje Rodzinne</h1>
    <button id="loginBtn">Zaloguj się</button>
</header>

<!-- Okno logowania -->
<div id="loginBox">
    <h3>Wpisz hasło:</h3>
    <input type="password" id="password" placeholder="Hasło">
    <button onclick="login()">Zaloguj</button>
</div>

<!-- Panel po zalogowaniu -->
<div id="panel">
    <h2>Dodaj zdjęcie i opis</h2>

    <input type="file" id="photoInput"><br><br>
    <input type="text" id="textInput" placeholder="Dodaj opis"><br><br>
    <button onclick="addItem()">Dodaj</button>

    <h2>Twoje wpisy:</h2>
    <div id="items"></div>
</div>

<script>
    const loginBtn = document.getElementById("loginBtn");
    const loginBox = document.getElementById("loginBox");
    const panel = document.getElementById("panel");

    const STORAGE_KEY = "kuku_entries";

    // ---- Wczytywanie zapisanych wpisów ----
    function loadEntries() {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
    }

    function saveEntries(entries) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function renderEntries() {
        const entries = loadEntries();
        const items = document.getElementById("items");
        items.innerHTML = "";

        entries.forEach(entry => {
            const div = document.createElement("div");
            div.className = "item";

            if (entry.img) {
            const img = document.createElement("img");
            img.src = entry.img;
            div.appendChild(img);
            }

            if (entry.text) {
                const p = document.createElement("p");
                p.textContent = entry.text;
                div.appendChild(p);
            }

            items.appendChild(div);
        });
    }

    // ---- Logowanie ----
    loginBtn.onclick = () => {
        loginBox.style.display = "block";
    };

    function login() {
        const pass = document.getElementById("password").value;
        if (pass === "3466123456") {
            loginBox.style.display = "none";
            panel.style.display = "block";
            loginBtn.style.display = "none";
            renderEntries();
        } else {
            alert("Złe hasło!");
        }
    }

    // ---- Dodawanie wpisu ----
    function addItem() {
        const file = document.getElementById("photoInput").files[0];
        const text = document.getElementById("textInput").value;

        if (!file && !text) {
            alert("Dodaj zdjęcie lub tekst!");
            return;
        }

        const entries = loadEntries();

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                entries.push({
                    img: e.target.result,
                    text: text
                });
                saveEntries(entries);
                renderEntries();
            };
            reader.readAsDataURL(file);
        } else {
            entries.push({
                img: null,
                text: text
            });
            saveEntries(entries);
            renderEntries();
        }

        document.getElementById("textInput").value = "";
        document.getElementById("photoInput").value = "";
    }
</script>

</body>
</html>
